_min_copier_version: '9'
_templates_suffix: .jinja
_subdirectory: template
_overwrite: true
_update: true
_envops:
  autoescape: false
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

_repo: "https://github.com/mohammedsameeruddin-blk/datascience_template"
_revision: feature/ds_template

_message_before_copy: |
  Thanks for using our datascience template to bootstrap your new project.

  Please, reply to the question carefully as the answers will be used to configure the scaffold of your project.

# DS project info
project:
  type: str
  help: "Your DS project name (without prefixes like ds_, ds-, etc)"
  validator: >-
    {% if not project or project | regex_search('[^a-zA-Z0-9_-]') %}
    project must contain letters, numbers, dashes and underscores.
    {% endif %}

# Ask every time to create a new model onboarding pipeline
model:
  type: str
  help: "Your model name (e.g., customer)"
  validator: >-
    {% if not model or model | regex_search('[^a-zA-Z0-9_-]') %}
    model must contain letters, numbers, dashes and underscores.
    {% endif %}

# Ask every time to create a new dataset keyword for preprocessing and featurization
dataset_keyword:
  type: str
  help: "Your dataset keyword (e.g., customer_transactions)"
  validator: >-
    {% if not dataset_keyword or dataset_keyword | regex_search('[^a-zA-Z0-9_-]') %}
    dataset_keyword must contain letters, numbers, dashes and underscores.
    {% endif %}

# Ask every time to create a new model onboarding pipeline
model_type:
  type: str
  choices:
    - Regression
    - Classification
  help: "Select the model type"

author_email:
  type: str
  help: "Your email address"
  validator: >-
    {% if not (author_email | regex_search('([A-Za-z0-9]+[.-_])*[A-Za-z0-9]+@[A-Za-z0-9-]+(\.[A-Z|a-z]{2,})+'))
    %}
    author_email is not a valid email address.
    {% endif %}

_message_after_copy: |
  Congratulations! Your project has been successfully created!