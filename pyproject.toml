[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-cli"
version = "0.1.0"
description = "CLI tool for managing data science projects"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "DataScience Team" }
]

dependencies = [
    "click>=8.0.0",
    "colorama>=0.4.4",
    "jinja2>=3.1.0",
]

[project.scripts]
ds-cli = "ds_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["ds_cli*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ds_cli = ["templates/**/*.jinja"]
