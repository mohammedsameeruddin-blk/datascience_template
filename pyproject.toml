[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-cli"
version = "0.1.0"
description = "CLI tool for managing data science projects - add datasets, models, and more"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "DataScience Team"}
]

dependencies = [
    "click>=8.0.0",
    "pydantic>=1.8.0",
    "colorama>=0.4.4",
]

[project.scripts]
ds-cli = "ds_cli.main:cli"

[tool.setuptools]
packages = ["ds_cli"]
